<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ASCII Generator</title>
<style>
  body { font-family: monospace; padding: 20px; }
  #ascii { white-space: pre; font-size: 8px; line-height: 8px; }
</style>
</head>
<body>

<h2>ASCII Art Generator</h2>

<input type="file" id="file" accept="image/*"><br><br>
<pre id="ascii"></pre>

<script>
const fileInput = document.getElementById("file");
const asciiBox = document.getElementById("ascii");

fileInput.onchange = () => {
    const file = fileInput.files[0];
    if (!file) return;

    const img = new Image();
    img.onload = () => convertToASCII(img);
    img.src = URL.createObjectURL(file);
};

function convertToASCII(img) {
    const width = 120; // output width
    const scale = img.height / img.width;
    const height = Math.floor(width * scale * 0.55); // adjust for font aspect ratio

    const canvas = document.createElement("canvas");
    canvas.width = width;
    canvas.height = height;

    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0, width, height);

    const chars = "@#%xo;:,. "; // darkest → lightest
    const imgData = ctx.getImageData(0, 0, width, height).data;

    let ascii = "";
    for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
            const i = (y * width + x) * 4;
            const r = imgData[i];
            const g = imgData[i+1];
            const b = imgData[i+2];

            const brightness = (r + g + b) / 3;
            const index = Math.floor((brightness / 255) * (chars.length - 1));

            ascii += chars[index];
        }
        ascii += "\n";
    }

    asciiBox.textContent = ascii;
}
</script>

</body>
</html>
