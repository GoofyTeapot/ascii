<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Color ASCII Generator</title>
<style>
  body { font-family: monospace; padding: 20px; }
  #ascii { font-size: 8px; line-height: 8px; white-space: pre; }
</style>
</head>
<body>

<h2>Color ASCII Art Generator</h2>

<input type="file" id="file" accept="image/*"><br><br>
<div id="ascii"></div>

<script>
const fileInput = document.getElementById("file");
const asciiBox = document.getElementById("ascii");

fileInput.onchange = () => {
    const file = fileInput.files[0];
    if (!file) return;

    const img = new Image();
    img.onload = () => convertToASCII(img);
    img.src = URL.createObjectURL(file);
};

function convertToASCII(img) {
    const width = 120;
    const scale = img.height / img.width;
    const height = Math.floor(width * scale * 0.55);

    const canvas = document.createElement("canvas");
    canvas.width = width;
    canvas.height = height;

    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0, width, height);

    const chars = "@#%xo;:,. ";
    const data = ctx.getImageData(0, 0, width, height).data;

    let html = "";

    for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
            const i = (y * width + x) * 4;
            const r = data[i];
            const g = data[i+1];
            const b = data[i+2];

            const brightness = (r + g + b) / 3;
            const index = Math.floor((brightness / 255) * (chars.length - 1));
            const char = chars[index];

            html += `<span style="color: rgb(${r},${g},${b})">${char}</span>`;
        }
        html += "<br>";
    }

    asciiBox.innerHTML = html;
}
</script>

</body>
</html>
